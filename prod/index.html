<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проверка клиентов</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>

<header>
  <img class="logo" src="logo.png" alt="Логотип">
  <div>
    <h1>Проверка клиентов</h1>
  </div>
  <div class="conn"><span class="dot" id="connDot"></span><span id="connText">подключение…</span></div>
</header>

<main>
  <div class="panel">
    <div class="panel-head">
      <h2>Клиенты</h2>
      <span class="hint" id="countHint"></span>
      <input type="search" id="search" class="search" placeholder="Поиск по ФИО, ИНН или СНИЛС">
      <div class="refresh">
        <button class="btn-ghost" onclick="loadClients()">Обновить список</button>
        <span class="last-update" id="lastUpdate"></span>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Клиент</th>
          <th style="width:220px">Статус проверки</th>
          <th style="width:170px">Действие</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="3" class="empty">Загрузка…</td></tr>
      </tbody>
    </table>

    <div class="pager" id="pager"></div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script src="script.js?v=3"></script>
</body>
</html>
